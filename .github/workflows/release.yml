name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: 'v1.0.0'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/package_release.py'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v1.0.0' }}
    steps:
      - name: Check out packaging tools
        uses: actions/checkout@v4
        with:
          path: release-tools
          persist-credentials: false
      - name: Check release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$draft" != "true" ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the selected source tag
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Build release files
        if: steps.release.outputs.build == 'true'
        run: |
          python3 -m py_compile source/tgbot.py source/settings.py
      - name: Package sources, licenses, and checksums
        if: steps.release.outputs.build == 'true'
        run: |
          version="${RELEASE_TAG#v}"
          python3 release-tools/.github/scripts/package_release.py source release-output replytgbot "$version"
      - name: Attach packages to the existing release
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-output/* --repo "$GITHUB_REPOSITORY" --clobber
